<!DOCTYPE html>
<html lang="ja">


<head>
    <meta charset="UTF-8">

     <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="健康市場 うにのきもち-雑記">
<meta property="og:description" content="- kenkoichiba uninokimomochi -">
<meta property="og:image" content="https://tsufuji43.github.io/kenkoichiba/images/ogp.png">
<meta property="og:url" content="https://tsufuji43.github.io/kenkoichiba/diary-detail.html">
<meta property="og:type" content="website">

</head>

<body>

<div class="site">

    <!-- ヘッダー -->
    <header>

        <div class="header-deco">✽✽✽</div>

        <h1>
            <img src="images/logo.png" alt="健康市場 うにのきもち">
        </h1>

        <p class="subtitle">
            - kenkoichiba uninokimochi -
        </p>

        <div class="header-deco">✽✽✽</div>

    </header>


<div class="layout">

    <!-- 左メニュー -->
    <aside class="menu">

        <h2>✽ メニュー ✽</h2>

        <nav>
            <a href="index.html">トップ</a>
            <a href="">[準備中]</a>
            <a href="diary.html">雑記</a>
            <a href="about.html">情報</a>
            <a href="admin.html">[管理者専用]</a>
        </nav>

    </aside>


    <main>

        <p>
            <a href="diary.html">← 雑記一覧に戻る</a>
        </p>


        <article id="diary-detail">

            <p>記事を読み込み中……</p>

        </article>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

const diaryDetail =
    document.getElementById("diary-detail");


const users = {

    "0cb63a34-76a9-4f23-bc94-b8bc63d68050": {
        name: "つふじ",
        icon: "images/uni.jpg"
    },

    "866f58f4-e493-4f62-999b-2aba99af71ef": {
        name: "健康法",
        icon: "images/kenkou.jpg"
    }

};


function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


function formatDate(dateString) {

    const date = new Date(dateString);

    return date.toLocaleString("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
    });

}


async function loadDiaryDetail() {

    const params =
        new URLSearchParams(window.location.search);

    const diaryId = params.get("id");


    if (!diaryId) {

        diaryDetail.innerHTML =
            "<p>記事が見つかりませんでした。</p>";

        return;

    }


    const {
        data: {
            user
        }
    } = await window.mySupabase.auth.getUser();


    const {
        data: diary,
        error
    } = await window.mySupabase

        .from("diary")

        .select(
            "id, title, content, user_id, created_at, image_url"
        )

        .eq("id", diaryId)

        .single();


    if (error) {

        console.error(error);

        diaryDetail.innerHTML =
            "<p>記事を読み込めませんでした。</p>";

        return;

    }


    const author = users[diary.user_id] || {

        name: "不明",

        icon: "images/logo.png"

    };


    const isMine =
        user && diary.user_id === user.id;


    let imageHtml = "";


    if (diary.image_url) {

        imageHtml = `

            <div class="diary-detail-image">

                <img
                    src="${diary.image_url}"
                    alt="日記の画像"
                >

            </div>

        `;

    }


    let buttons = "";


    if (isMine) {

        buttons = `

            <div class="diary-actions">

                <button
                    type="button"
                    id="edit-button"
                >
                    編集
                </button>

                <button
                    type="button"
                    id="delete-button"
                >
                    削除
                </button>

            </div>

        `;

    }


    diaryDetail.innerHTML = `

        <div class="diary-author">

            <img
                src="${author.icon}"
                alt="${escapeHtml(author.name)}"
            >

            <span>
                ${escapeHtml(author.name)}
            </span>

        </div>


        <div class="diary-entry-date">

            ${formatDate(diary.created_at)}

        </div>


        <h1>

            ${escapeHtml(diary.title)}

        </h1>


        ${imageHtml}

<div class="diary-detail-content">
    <p id="diary-content-text"></p>
</div>


        ${buttons}

    `;

const contentElement =
    document.getElementById("diary-content-text");

const contentText = diary.content || "";

// 太字と普通の文章をDOMに追加する関数
function appendFormattedText(parent, text) {

    const boldRegex = /\*\*(.+?)\*\*/g;

    let last = 0;
    let boldMatch;

    while ((boldMatch = boldRegex.exec(text)) !== null) {

        // 太字の前の普通の文章
        if (boldMatch.index > last) {
            parent.appendChild(
                document.createTextNode(
                    text.slice(last, boldMatch.index)
                )
            );
        }

        // 太字
        const strong =
            document.createElement("strong");

        strong.textContent = boldMatch[1];

        parent.appendChild(strong);

        last =
            boldMatch.index +
            boldMatch[0].length;
    }

    // 残りの文章
    if (last < text.length) {
        parent.appendChild(
            document.createTextNode(
                text.slice(last)
            )
        );
    }
}


// 本文を「画像」と「文章」に分ける
const imageRegex =
    /\[IMAGE:(https?:\/\/[^\]\s]+)\]/g;

let lastIndex = 0;
let imageMatch;


// 画像を探す
while ((imageMatch = imageRegex.exec(contentText)) !== null) {

    // 画像より前の文章
    const beforeText =
        contentText.slice(
            lastIndex,
            imageMatch.index
        );

    if (beforeText) {
        appendFormattedText(
            contentElement,
            beforeText
        );
    }


    // 画像を作る
    const img =
        document.createElement("img");

    img.src = imageMatch[1];

    img.alt = "本文画像";

    img.className = "diary-content-image";

    contentElement.appendChild(img);


    // 次の位置
    lastIndex =
        imageMatch.index +
        imageMatch[0].length;
}


// 最後に残った文章
const remainingText =
    contentText.slice(lastIndex);


// URLを処理するための関数
function appendTextWithUrls(parent, text) {

    const urlRegex =
        /https?:\/\/[^\s<]+/g;

    let last = 0;
    let match;

    while ((match = urlRegex.exec(text)) !== null) {

        // URLより前
        if (match.index > last) {

            appendFormattedText(
                parent,
                text.slice(last, match.index)
            );
        }


        let url = match[0];

        // URL末尾の記号を分離
        let trailing = "";

        while (
            /[。、！？）」』】〉》）\]}>]$/.test(url)
        ) {

            trailing =
                url.slice(-1) + trailing;

            url =
                url.slice(0, -1);
        }


        // YouTubeか判定
        const isYouTube =
            /^(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be)\//
                .test(url);


        if (isYouTube) {

            let youtubeId = "";

            if (url.includes("youtu.be/")) {

                youtubeId =
                    url.split("youtu.be/")[1]
                       .split("?")[0];

            } else {

                youtubeId =
                    new URL(url)
                        .searchParams
                        .get("v");
            }


            const link =
                document.createElement("a");

            link.href = url;
            link.target = "_blank";
            link.rel = "noopener";
            link.className =
                "youtube-thumbnail";


            const img =
                document.createElement("img");

            img.src =
                "https://img.youtube.com/vi/" +
                youtubeId +
                "/maxresdefault.jpg";

            img.alt = "YouTube動画";


            link.appendChild(img);

            parent.appendChild(link);

        } else {

            // 普通のURL
            const link =
                document.createElement("a");

            link.href = url;
            link.target = "_blank";
            link.rel = "noopener";

            link.textContent = url;

            parent.appendChild(link);
        }


        // URL後ろの記号
        if (trailing) {

            appendFormattedText(
                parent,
                trailing
            );
        }


        last =
            match.index +
            match[0].length;
    }


    // 残った文章
    if (last < text.length) {

        appendFormattedText(
            parent,
            text.slice(last)
        );
    }
}


// 残りの文章にURL処理を適用
if (remainingText) {

    appendTextWithUrls(
        contentElement,
        remainingText
    );
}


const editButton =
    document.getElementById("edit-button");


if (editButton) {

    editButton.addEventListener(
        "click",
        function() {

            window.location.href =
                "edit.html?id=" + diary.id;

        }
    );

}


    const deleteButton =
        document.getElementById("delete-button");


    if (deleteButton) {

        deleteButton.addEventListener(
            "click",
            async function() {

                const result =
                    confirm("この記事を削除する？");


                if (!result) {

                    return;

                }


                const {
                    error
                } = await window.mySupabase

                    .from("diary")

                    .delete()

                    .eq("id", diary.id);


                if (error) {

                    console.error(error);

                    alert(
                        "記事を削除できませんでした。"
                    );

                    return;

                }


                window.location.href =
                    "diary.html";

            }
        );

    }

}


loadDiaryDetail();

</script>

</body>

</html>
