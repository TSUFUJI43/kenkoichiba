<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>パスワード変更｜健康市場 うにのきもち</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head>

<body>

<div class="site">

<header>
    <div class="header-deco">✽✽✽</div>

    <h1>
        <img src="images/logo.png" alt="健康市場 うにのきもち">
    </h1>

    <p class="subtitle">- kenkoichiba uninokimochi -</p>

    <div class="header-deco">✽✽✽</div>
</header>

<div class="layout">

<aside class="menu">
    <h2>✽ メニュー ✽</h2>

    <nav>
        <a href="index.html">トップ</a>
        <a href="gallery.html">ギャラリー</a>
        <a href="diary.html">日記</a>
        <a href="about.html">情報</a>

                <a href="write.html">[管理者専用]</a>
    </nav>
</aside>

<main>

<section>

<h2>✽ パスワード変更 ✽</h2>

<div style="padding: 25px;">

    <p>新しいパスワードを入力してください。</p>

    <form id="update-password-form">

        <p>
            <label for="password">新しいパスワード</label><br>
            <input
                type="password"
                id="password"
                required
                minlength="6"
                style="width:100%; max-width:400px; padding:10px; margin-top:5px;"
            >
        </p>

        <p>
            <label for="password-confirm">新しいパスワード（確認）</label><br>
            <input
                type="password"
                id="password-confirm"
                required
                minlength="6"
                style="width:100%; max-width:400px; padding:10px; margin-top:5px;"
            >
        </p>

        <button type="submit" style="padding:10px 20px;">
            パスワードを変更する
        </button>

    </form>

    <p id="message"></p>

</div>

</section>

<p class="more">
    → <a href="login.html">ログインページへ</a>
</p>

<footer>
    ✽ since 2026 ✽
</footer>

</main>

</div>
</div>

<script>

const form = document.getElementById("update-password-form");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const password = document.getElementById("password").value;
    const passwordConfirm = document.getElementById("password-confirm").value;

    if (password !== passwordConfirm) {
        message.textContent = "パスワードが一致していません。";
        return;
    }

    const { error } = await window.mySupabase.auth.updateUser({
        password: password
    });

    if (error) {
        console.error(error);
        message.textContent = "パスワードを変更できませんでした。";
        return;
    }

    message.textContent = "パスワードを変更しました！ログインページへ移動します。";

    setTimeout(() => {
        window.location.href = "login.html";
    }, 1500);

});

</script>

</body>
</html>
