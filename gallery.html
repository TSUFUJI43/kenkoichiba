<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>健康市場 うにのきもち</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="site">

    <header>
        <div class="header-deco">✽✽✽</div>

        <h1>
            <img src="images/logo.png" alt="健康市場 うにのきもち">
        </h1>

        <p class="subtitle">
            - kenkoichiba uninokimochi -
        </p>

        <div class="header-deco">✽✽✽</div>
    </header>


    <div class="layout">

        <aside class="menu">

            <h2>✽ メニュー ✽</h2>

            <nav>
                <a href="index.html">トップ</a>
                <a href="gallery.html">ギャラリー</a>
                <a href="diary.html">雑記</a>
                <a href="about.html">情報</a>
                <a href="write.html">[管理者専用]</a>
            </nav>

        </aside>


        <main>

            <!-- =========================
                 ギャラリー
            ========================= -->

            <section>

                <h2>＊ ギャラリー ＊</h2>

                <p class="gallery-intro">
                    イラスト・漫画・らくがきをまとめて展示しています。
                </p>

<div
    class="gallery-authors"
    id="gallery-authors"
>
</div>

            </section>



            <p class="more">
                → <a href="index.html">トップに戻る</a>
            </p>


            <footer>
                ✽　since 2026　｜　健康市場 うにのきもち　｜　✽
            </footer>

        </main>

    </div>

</div>



<!-- =========================
     ライトボックス
========================= -->

<dialog id="gallery-modal">

    <div class="gallery-modal-inner">


        <!-- 閉じる -->

        <button
            id="gallery-modal-close"
            class="gallery-modal-close"
            type="button"
        >
            ×
        </button>


        <!-- =========================
             画像だけスクロールする部分
        ========================= -->

        <div
            id="gallery-image-area"
            class="gallery-image-area"
        >
        </div>


        <!-- =========================
             作品情報
             ここは固定
        ========================= -->

       <div class="gallery-info">

    <h3 id="gallery-modal-title">
    </h3>

    <div
        id="gallery-modal-tags"
        class="gallery-modal-tags"
    >
    </div>

    <p
        id="gallery-modal-description"
        class="gallery-modal-description"
    >
    </p>

    <div
        id="gallery-modal-actions"
        class="gallery-modal-actions"
    >
        <button
            id="gallery-modal-edit"
            type="button"
        >
            編集
        </button>

        <button
            id="gallery-modal-delete"
            type="button"
        >
            削除
        </button>
    </div>

</div>

<div
    id="gallery-edit-form"
    class="gallery-edit-form"
    style="display: none;"
>

    <h3>作品を編集</h3>

    <label>
        タイトル
        <input
            type="text"
            id="gallery-edit-title"
        >
    </label>

    <label>
        タグ
        <input
            type="text"
            id="gallery-edit-tags"
            placeholder="例：イラスト, うに, オリジナル"
        >
    </label>

    <label>
        説明
        <textarea
            id="gallery-edit-description"
            rows="5"
        ></textarea>
    </label>

    <div class="gallery-edit-buttons">

        <button
            id="gallery-edit-cancel"
            type="button"
        >
            キャンセル
        </button>

        <button
            id="gallery-edit-save"
            type="button"
        >
            保存
        </button>

    </div>

    <p id="gallery-edit-message"></p>

</div>

            <p
                id="gallery-modal-description"
                class="gallery-modal-description"
            >
            </p>

        </div>

    </div>

</dialog>



<script>

const SUPABASE_URL =
    "https://bvlmukmabwubdfaebzbo.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_CeYH12uKYMe07tYxd_flsA_cxdI922_";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


const galleryWorks =
    document.querySelectorAll(".gallery-work");

const galleryModal =
    document.getElementById("gallery-modal");

const galleryImageArea =
    document.getElementById("gallery-image-area");

const galleryTitle =
    document.getElementById("gallery-modal-title");

const galleryTags =
    document.getElementById("gallery-modal-tags");

const galleryDescription =
    document.getElementById("gallery-modal-description");

const galleryClose =
    document.getElementById("gallery-modal-close");

    const galleryActions =
    document.getElementById("gallery-modal-actions");

const galleryEdit =
    document.getElementById("gallery-modal-edit");

const galleryDelete =
    document.getElementById("gallery-modal-delete");
    let currentGalleryWork = null;

    const galleryEditForm =
    document.getElementById("gallery-edit-form");

const galleryEditTitle =
    document.getElementById("gallery-edit-title");

const galleryEditTags =
    document.getElementById("gallery-edit-tags");

const galleryEditDescription =
    document.getElementById("gallery-edit-description");

const galleryEditCancel =
    document.getElementById("gallery-edit-cancel");

const galleryEditSave =
    document.getElementById("gallery-edit-save");

const galleryEditMessage =
    document.getElementById("gallery-edit-message");

galleryEdit.addEventListener("click", () => {

    if (!currentGalleryWork) return;

    galleryEditTitle.value =
        currentGalleryWork.title || "";

    galleryEditTags.value =
        Array.isArray(currentGalleryWork.tags)
            ? currentGalleryWork.tags.join(", ")
            : "";

    galleryEditDescription.value =
        currentGalleryWork.description || "";

    galleryEditForm.style.display = "block";

    galleryEditMessage.textContent = "";

});

galleryEditCancel.addEventListener("click", () => {

    galleryEditForm.style.display = "none";

});

galleryEditSave.addEventListener("click", async () => {

    if (!currentGalleryWork) return;

    galleryEditSave.disabled = true;
    galleryEditSave.textContent = "保存中……";
    galleryEditMessage.textContent = "";

    try {

        const { data: { user }, error: userError } =
            await supabaseClient.auth.getUser();

        if (userError || !user) {
            throw new Error("ログインしてください。");
        }

        if (user.id !== currentGalleryWork.user_id) {
            throw new Error("この作品を編集する権限がありません。");
        }

        const title =
            galleryEditTitle.value.trim();

        const description =
            galleryEditDescription.value.trim();

        const tags =
            galleryEditTags.value
                .split(",")
                .map(tag => tag.trim())
                .filter(tag => tag !== "");

const { data: updatedWork, error } =
    await supabaseClient
        .from("gallery")
        .update({
            title: title,
            tags: tags,
            description: description
        })
        .eq("id", currentGalleryWork.id)
        .eq("user_id", user.id)
        .select()
        .single();

if (error) {
    throw error;
}

if (!updatedWork) {
    throw new Error("作品の更新対象が見つかりませんでした。");
}

        currentGalleryWork.title = title;
        currentGalleryWork.tags = tags;
        currentGalleryWork.description = description;

        galleryEditForm.style.display = "none";

        galleryEditSave.disabled = false;
        galleryEditSave.textContent = "保存";

        alert("作品を更新しました！");

        await loadGallery();

        galleryModal.close();

    } catch (error) {

        console.error("Gallery edit error:", error);

        galleryEditMessage.textContent =
            "保存に失敗しました。";

        alert(
            "保存に失敗しました。\n\n" +
            (error.message || error)
        );

        galleryEditSave.disabled = false;
        galleryEditSave.textContent = "保存";
    }

});

/* =========================
   作品を開く
========================= */

galleryWorks.forEach(work => {

    work.addEventListener("click", () => {

        /*
         * data-images の画像を取得
         */

        const images =
            work.dataset.images
                .split(",")
                .map(image => image.trim())
                .filter(image => image !== "");


        /*
         * 画像エリアを空にする
         */

        galleryImageArea.innerHTML = "";


        /*
         * 画像を全部並べる
         */

        images.forEach((image, index) => {

            const img =
                document.createElement("img");

            img.src = image;

            img.alt =
                work.dataset.title +
                " " +
                (index + 1);


            galleryImageArea.appendChild(img);

        });


        /*
         * タイトル
         */

        galleryTitle.textContent =
            work.dataset.title || "";


        /*
         * タグ
         */

        galleryTags.innerHTML = "";

        const tags =
            work.dataset.tags
                ? work.dataset.tags
                    .split(",")
                    .map(tag => tag.trim())
                    .filter(tag => tag !== "")
                : [];


        tags.forEach(tag => {

            const span =
                document.createElement("span");

            span.textContent =
                "#" + tag;

            galleryTags.appendChild(span);

        });


        /*
         * 説明
         */

        galleryDescription.textContent =
            work.dataset.description || "";


        /*
         * ライトボックスを開く
         */

        galleryModal.showModal();


        /*
         * 毎回一番上から開始
         */

        galleryImageArea.scrollTop = 0;

    });

});



/* =========================
   ×で閉じる
========================= */

galleryClose.addEventListener("click", () => {

    galleryModal.close();

});



/* =========================
   背景クリックで閉じる
========================= */

galleryModal.addEventListener("click", event => {

    if (event.target === galleryModal) {

        galleryModal.close();

    }

});



/* =========================
   ESCでも閉じる
========================= */

galleryModal.addEventListener("cancel", () => {

    galleryModal.close();

});

// =========================
// Supabaseからギャラリー投稿を取得
// =========================

const authorNames = {
    "0cb63a34-76a9-4f23-bc94-b8bc63d68050": "つふじ",
    "866f58f4-e493-4f62-999b-2aba99af71ef": "健康法"
};


async function loadGallery() {

    const { data, error } = await supabaseClient
        .from("gallery")
        .select("*")
        .order("created_at", { ascending: false });


    if (error) {

        console.error(
            "Gallery load error:",
            error
        );

        return;
    }


    console.log(
        "取得したギャラリー投稿:",
        data
    );


    const galleryAuthors =
        document.getElementById("gallery-authors");


    galleryAuthors.innerHTML = "";


    // 作者ごとに分ける
    const grouped = {};


    data.forEach(work => {

        const author =
            authorNames[work.user_id] ||
            "その他";


        if (!grouped[author]) {
            grouped[author] = [];
        }


        grouped[author].push(work);

    });


    // 作者ごとの表示
    Object.keys(grouped).forEach(author => {


        const authorSection =
            document.createElement("div");

        authorSection.className =
            "gallery-author";


        // 作者タイトル
        const authorTitle =
            document.createElement("div");

        authorTitle.className =
            "gallery-author-title";


        authorTitle.innerHTML = `
            <span>✽</span>
            <span>${author}の作品</span>
        `;


        authorSection.appendChild(
            authorTitle
        );


        // 作品グリッド
        const grid =
            document.createElement("div");

        grid.className =
            "gallery-grid";


        grouped[author].forEach(work => {

            const button =
                document.createElement("button");

            button.className =
                "gallery-work";

            button.type = "button";


            // 画像
            const images =
                Array.isArray(work.image_urls)
                    ? work.image_urls
                    : [];


            if (images.length > 0) {

                const img =
                    document.createElement("img");

                img.src = images[0];

                img.alt =
                    work.title || "作品";


                button.appendChild(img);

            }


            // 複数画像なら枚数表示
            if (images.length > 1) {

                const count =
                    document.createElement("span");

                count.className =
                    "gallery-count";

                count.textContent =
                    "[" + images.length + "]";


                button.appendChild(count);

            }


            // クリック時のライトボックス
            button.addEventListener(
                "click",
                () => {

                    currentGalleryWork = work;

                    galleryImageArea.innerHTML =
                        "";


                    images.forEach(
                        (image, index) => {

                            const img =
                                document.createElement("img");

                            img.src = image;

                            img.alt =
                                (work.title || "作品") +
                                " " +
                                (index + 1);


                            galleryImageArea.appendChild(
                                img
                            );

                        }
                    );


                    galleryTitle.textContent =
                        work.title || "";


                    galleryTags.innerHTML =
                        "";


                    const tags =
                        Array.isArray(work.tags)
                            ? work.tags
                            : [];


                    tags.forEach(tag => {

                        const span =
                            document.createElement("span");

                        span.textContent =
                            "#" + tag;


                        galleryTags.appendChild(
                            span
                        );

                    });


                    galleryDescription.textContent =
                        work.description || "";

                        supabaseClient.auth.getUser().then(({ data }) => {

    const user = data.user;

    if (user && user.id === work.user_id) {

        galleryActions.style.display = "flex";

    } else {

        galleryActions.style.display = "none";

    }

});


                    galleryModal.showModal();


                    galleryImageArea.scrollTop =
                        0;

                }
            );


            grid.appendChild(button);

        });


authorSection.appendChild(grid);

// 作者のギャラリーへのリンク
const more =
    document.createElement("p");

more.className =
    "gallery-more";

more.innerHTML = `
    → <a href="#">${author}のギャラリーへ</a>
`;

authorSection.appendChild(more);

galleryAuthors.appendChild(
    authorSection
);

    });

}


loadGallery();

</script>


</body>

</html>
