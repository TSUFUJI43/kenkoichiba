const galleryDelete =

    let currentGalleryWork = null;

    galleryDelete.addEventListener("click", async () => {

    if (!currentGalleryWork) return;

    const confirmed = confirm(
        "この作品を削除しますか？\n\n画像もすべて削除されます。"
    );

    if (!confirmed) return;

    galleryDelete.disabled = true;
    galleryDelete.textContent = "削除中……";

    try {

        const { data: { user }, error: userError } =
            await supabaseClient.auth.getUser();

        if (userError || !user) {
            throw new Error("ログインしてください。");
        }

        if (user.id !== currentGalleryWork.user_id) {
            throw new Error(
                "この作品を削除する権限がありません。"
            );
        }
        

        // 画像URLからStorage上のファイルパスを取り出す
        const imageUrls =
            Array.isArray(currentGalleryWork.image_urls)
                ? currentGalleryWork.image_urls
                : [];

        const storagePaths = imageUrls
            .map(url => {
                const marker =
                    "/storage/v1/object/public/gallery-images/";

                const index = url.indexOf(marker);

                if (index === -1) return null;

                return url.slice(index + marker.length);
            })
            .filter(path => path);

        // Storageから画像を削除
        if (storagePaths.length > 0) {

            const { error: storageError } =
                await supabaseClient.storage
                    .from("gallery-images")
                    .remove(storagePaths);

            if (storageError) {
                throw storageError;
            }
        }

        // galleryテーブルから投稿を削除
        const { error: deleteError } =
            await supabaseClient
                .from("gallery")
                .delete()
                .eq("id", currentGalleryWork.id)
                .eq("user_id", user.id);

        if (deleteError) {
            throw deleteError;
        }

        alert("作品を削除しました！");

        currentGalleryWork = null;

        galleryActions.style.display = "none";

        galleryEditForm.style.display = "none";

        galleryModal.close();

        await loadGallery();

    } catch (error) {

        alert(
            "削除に失敗しました。\n\n" +
            (error.message || error)
        );

        galleryDelete.disabled = false;
        galleryDelete.textContent = "削除";
    }

});

let editImages = [];
let originalEditImages = [];

const galleryEditNewImages =

/* =========================
   編集画像を表示
========================= */

function renderEditImages() {

    galleryEditImages.innerHTML = "";

    editImages.forEach((imageData, index) => {

        const item =
            document.createElement("div");

        item.className =
            "gallery-edit-image-item";

        item.draggable = true;

        item.dataset.index = index;

        item.innerHTML = `
            <div class="gallery-edit-image-number">
                ${index + 1}枚目
            </div>

            <img
                src="${imageData.url}"
                alt=""
            >

            <div class="gallery-edit-image-drag">
                ☷ ドラッグして順番を変更
            </div>

            <button
                type="button"
                class="gallery-edit-image-delete"
            >
                この画像を削除
            </button>
        `;


        /* ドラッグ開始 */

        item.addEventListener(
            "dragstart",
            event => {

                item.classList.add(
                    "is-dragging"
                );

                event.dataTransfer.effectAllowed =
                    "move";

                event.dataTransfer.setData(
                    "text/plain",
                    index
                );

            }
        );


        /* ドラッグ終了 */

        item.addEventListener(
            "dragend",
            () => {

                item.classList.remove(
                    "is-dragging"
                );

            }
        );


        /* ドラッグ中 */

        item.addEventListener(
            "dragover",
            event => {

                event.preventDefault();

                item.classList.add(
                    "drag-over"
                );

            }
        );


        /* ドラッグが外れた */

        item.addEventListener(
            "dragleave",
            () => {

                item.classList.remove(
                    "drag-over"
                );

            }
        );


        /* ドロップ */

        item.addEventListener(
            "drop",
            event => {

                event.preventDefault();

                item.classList.remove(
                    "drag-over"
                );

                const fromIndex =
                    Number(
                        event.dataTransfer
                            .getData("text/plain")
                    );

                const toIndex = index;

                if (fromIndex === toIndex) {
                    return;
                }

                const movedImage =
                    editImages.splice(
                        fromIndex,
                        1
                    )[0];

                editImages.splice(
                    toIndex,
                    0,
                    movedImage
                );

                renderEditImages();

            }
        );


        /* 削除 */

        const deleteButton =
            item.querySelector(
                ".gallery-edit-image-delete"
            );

        deleteButton.addEventListener(
            "click",
            () => {

                if (editImages.length <= 1) {

                    alert(
                        "画像は最低1枚残してください。"
                    );

                    return;
                }

                editImages.splice(
                    index,
                    1
                );

                renderEditImages();

            }
        );


        galleryEditImages.appendChild(
            item
        );

    });

}


/* =========================
   新しい画像を追加
========================= */

galleryEditAddImageInput.addEventListener(
    "change",
    event => {

        const newFiles =
            Array.from(event.target.files);

        newFiles.forEach(file => {

            const imageURL =
                URL.createObjectURL(file);

            editImages.push({
                type: "new",
                file: file,
                url: imageURL
            });

        });

        renderEditImages();

        galleryEditAddImageInput.value = "";

    }
);


/* =========================
   編集ボタン
========================= */

galleryEdit.addEventListener(
    "click",
    () => {

        if (!currentGalleryWork) return;

        galleryEditTitle.value =
            currentGalleryWork.title || "";

        galleryEditTags.value =
            Array.isArray(currentGalleryWork.tags)
                ? currentGalleryWork.tags.join(", ")
                : "";

        galleryEditDescription.value =
            currentGalleryWork.description || "";


        editImages =
            Array.isArray(
                currentGalleryWork.image_urls
            )
                ? currentGalleryWork.image_urls.map(
                    url => ({
                        type: "existing",
                        url: url
                    })
                )
                : [];


        originalEditImages =
            editImages.map(image => ({
                type: image.type,
                url: image.url
            }));


        renderEditImages();


        galleryEditForm.style.display =
            "block";

        galleryEditMessage.textContent =
            "";

    }
);


/* =========================
   キャンセル
========================= */

galleryEditCancel.addEventListener(
    "click",
    () => {

        galleryEditForm.style.display =
            "none";

);

galleryEditSave.addEventListener("click", async () => {

    if (!currentGalleryWork) return;

    galleryEditSave.disabled = true;
    galleryEditSave.textContent = "保存中……";
    galleryEditMessage.textContent = "";

    try {

        const { data: { user }, error: userError } =
            await supabaseClient.auth.getUser();

        if (userError || !user) {
            throw new Error("ログインしてください。");
        }

        if (user.id !== currentGalleryWork.user_id) {
            throw new Error("この作品を編集する権限がありません。");
        }

        console.log("編集対象:", currentGalleryWork);
console.log("ログインユーザー:", user.id);

        const title =
            galleryEditTitle.value.trim();

        const description =
            galleryEditDescription.value.trim();

// 並び順どおりに画像を保存する
const finalImageUrls = [];

for (const image of editImages) {

    // 既存画像
    if (image.type === "existing") {

        finalImageUrls.push(image.url);

    }

    // 新しく追加した画像
    else if (image.type === "new") {

        const file = image.file;

        const extension =
            file.name.split(".").pop().toLowerCase();

        const filePath =
            `${user.id}/${crypto.randomUUID()}.${extension}`;

        const { error: uploadError } =
            await supabaseClient.storage
                .from("gallery-images")
                .upload(filePath, file);

        if (uploadError) {
            throw uploadError;
        }

        const { data: publicUrlData } =
            supabaseClient.storage
                .from("gallery-images")
                .getPublicUrl(filePath);

        finalImageUrls.push(
            publicUrlData.publicUrl
        );

    }

}

console.log(
    "最終的に保存する画像URL:",
    finalImageUrls
);

const deletedImageUrls = originalEditImages
    .map(image => image.url)
    .filter(url => !finalImageUrls.includes(url));

console.log("残っている画像:", finalImageUrls);
console.log("削除された画像:", deletedImageUrls);

const deletedStoragePaths = deletedImageUrls
    .map(url => getStoragePathFromPublicUrl(url))
    .filter(path => path !== null);

console.log(
    "Storageから削除するファイル:",
    deletedStoragePaths
);

        const tags =
            galleryEditTags.value
                .split(",")
                .map(tag => tag.trim())
                .filter(tag => tag !== "");

const { data: updatedWork, error } =
    await supabaseClient
        .from("gallery")
        .update({
            title: title,
            tags: tags,
            description: description,
            image_urls: finalImageUrls
        })
        .eq("id", currentGalleryWork.id)
        .eq("user_id", user.id)
        .select();

console.log("更新結果:", updatedWork);

if (error) {
    throw error;
}

if (!updatedWork || updatedWork.length === 0) {
    throw new Error(
        "更新された作品が0件でした。\n" +
        "作品ID: " + currentGalleryWork.id + "\n" +
        "ユーザーID: " + user.id + "\n" +
        "作品のユーザーID: " + currentGalleryWork.user_id
    );
}

if (deletedStoragePaths.length > 0) {

    const { error: storageDeleteError } =
        await supabaseClient.storage
            .from("gallery-images")
            .remove(deletedStoragePaths);

    if (storageDeleteError) {
        console.error(
            "Storage削除エラー:",
            storageDeleteError
        );

        throw storageDeleteError;
    }
}

if (error) {
    throw error;
}

if (!updatedWork) {
    throw new Error("作品の更新対象が見つかりませんでした。");
}

        currentGalleryWork.title = title;
        currentGalleryWork.tags = tags;
        currentGalleryWork.description = description;

        galleryEditForm.style.display = "none";

        galleryEditSave.disabled = false;
        galleryEditSave.textContent = "保存";

        alert("作品を更新しました！");

        galleryModal.close();

    } catch (error) {

        console.error("Gallery edit error:", error);

        galleryEditMessage.textContent =
            "保存に失敗しました。";

        alert(
            "保存に失敗しました。\n\n" +
            (error.message || error)
        );

        galleryEditSave.disabled = false;
        galleryEditSave.textContent = "保存";
    }

});

function getStoragePathFromPublicUrl(url) {

    const marker =
        "/storage/v1/object/public/gallery-images/";

    const index =
        url.indexOf(marker);

    if (index === -1) {
        return null;
    }

    return url.slice(
        index + marker.length
    );
}

// =========================
// Supabaseからギャラリー投稿を取得

const authorNames = {
    "0cb63a34-76a9-4f23-bc94-b8bc63d68050": "つふじ",
    "866f58f4-e493-4f62-999b-2aba99af71ef": "健康法"
};


async function loadGallery() {

    const { data, error } = await supabaseClient
        .from("gallery")
        .select("*")
        .order("created_at", { ascending: false });


    if (error) {

        console.error(
            "Gallery load error:",
            error
        );

        return;
    }


    console.log(
        "取得したギャラリー投稿:",
        data
    );


    const galleryAuthors =
        document.getElementById("gallery-authors");


    galleryAuthors.innerHTML = "";


    // 作者ごとに分ける
    const grouped = {};


    data.forEach(work => {

        const author =
            authorNames[work.user_id] ||
            "その他";


        if (!grouped[author]) {
            grouped[author] = [];
        }


        grouped[author].push(work);

    });


    // 作者ごとの表示
    Object.keys(grouped).forEach(author => {


        const authorSection =
            document.createElement("div");

        authorSection.className =
            "gallery-author";


        // 作者タイトル
        const authorTitle =
            document.createElement("div");

        authorTitle.className =
            "gallery-author-title";


        authorTitle.innerHTML = `
            <span>✽</span>
            <span>${author}の作品</span>
        `;


        authorSection.appendChild(
            authorTitle
        );


        // 作品グリッド
        const grid =
            document.createElement("div");

        grid.className =
            "gallery-grid";


        grouped[author].forEach(work => {

            const button =
                document.createElement("button");

            button.className =
                "gallery-work";

            button.type = "button";


            // 画像
            const images =
                Array.isArray(work.image_urls)
                    ? work.image_urls
                    : [];


            if (images.length > 0) {

                const img =
                    document.createElement("img");

                img.src = images[0];

                img.alt =
                    work.title || "作品";


                button.appendChild(img);

            }


            // 複数画像なら枚数表示
            if (images.length > 1) {

                const count =
                    document.createElement("span");

                count.className =
                    "gallery-count";

                count.textContent =
                    "[" + images.length + "]";


                button.appendChild(count);

            }


            // クリック時のライトボックス
            button.addEventListener(
                "click",
                () => {

                    currentGalleryWork = work;

                    galleryImageArea.innerHTML =
                        "";


                    images.forEach(
                        (image, index) => {

                            const img =
                                document.createElement("img");

                            img.src = image;

                            img.alt =
                                (work.title || "作品") +
                                " " +
                                (index + 1);


                            galleryImageArea.appendChild(
                                img
                            );

                        }
                    );


                    galleryTitle.textContent =
                        work.title || "";


                    galleryTags.innerHTML =
                        "";


                    const tags =
                        Array.isArray(work.tags)
                            ? work.tags
                            : [];


                    tags.forEach(tag => {

                        const span =
                            document.createElement("span");

                        span.textContent =
                            "#" + tag;


                        galleryTags.appendChild(
                            span
                        );

                    });


                    galleryDescription.textContent =
                        work.description || "";

                        supabaseClient.auth.getUser().then(({ data }) => {

    const user = data.user;

    if (user && user.id === work.user_id) {

        galleryActions.style.display = "flex";

    } else {

        galleryActions.style.display = "none";

    }

});


                    galleryModal.showModal();


                    galleryImageArea.scrollTop =
                        0;

                }
            );


            grid.appendChild(button);

        });


authorSection.appendChild(grid);

more.className =

galleryAuthors.appendChild(

    });

}


loadGallery();
