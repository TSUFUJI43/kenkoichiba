<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>記事を編集 - 健康市場 うにのきもち</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

</head>


<body>

<div class="site">

    <!-- ヘッダー -->
    <header>

        <div class="header-deco">✽✽✽</div>

        <h1>
            <img src="images/logo.png" alt="健康市場 うにのきもち">
        </h1>

        <p class="subtitle">
            - kenkoichiba uninokimochi -
        </p>

        <div class="header-deco">✽✽✽</div>

    </header>


    <main>

        <section>

            <h2>✽ 記事を編集 ✽</h2>


            <div style="padding: 25px;">

                <form id="edit-form">

                    <p>

                        <label>

                            タイトル<br>

                            <input
                                type="text"
                                id="title"
                                required
                                style="width: 100%; box-sizing: border-box;"
                            >

                        </label>

                    </p>

                    <p>
    <label>
        種類<br>

        <select id="category">

            <option value="日記">
                日記
            </option>

            <option value="感想">
                感想
            </option>

            <option value="進捗">
                進捗
            </option>

            <option value="雑談">
                雑談
            </option>

        </select>

    </label>
</p>

<p>
<label>
<input type="checkbox" id="is-public">
公開する
</label>
</p>


                    <p>

                        <label>

                            本文<br>

                            <textarea
                                id="content"
                                rows="12"
                                required
                                style="width: 100%; box-sizing: border-box;"
                            ></textarea>

                        </label>

                    </p>
<div id="content-image-preview">
    <p>本文画像</p>
</div>

<p>
    <button type="button" id="insert-content-image-button">
        ＋本文画像を追加
    </button>

    <input
        type="file"
        id="edit-content-image"
        accept="image/*"
        multiple
        hidden
    >
</p>

                    <p>
    <label>
        現在の画像
    </label>
</p>

<div id="current-image">
    <!-- 現在の画像がここに表示されます -->
</div>

<p>
    <label>
        新しい画像<br>
        <input
            type="file"
            id="image"
            accept="image/*"
        >
    </label>
</p>

<p>
    <label>
        <input
            type="checkbox"
            id="delete-image"
        >
        今のサムネ画像を削除する
    </label>
</p>


                    <button type="submit">
                        保存
                    </button>


                    <p id="message"></p>

                </form>


                <p class="more">

                    → <a href="diary.html">雑記一覧に戻る</a>

                </p>

            </div>

        </section>


        <footer>

            ✽　since 2026　｜　健康市場 うにのきもち　｜　✽

        </footer>

    </main>

</div>


<script>

const editForm = document.getElementById("edit-form");

const titleInput = document.getElementById("title");

const contentInput = document.getElementById("content");

const imageInput = document.getElementById("image");

const currentImage =
    document.getElementById("current-image");

    const deleteImage =
    document.getElementById("delete-image");

const message = document.getElementById("message");

const isPublicInput =
    document.getElementById("is-public");

const contentImagePreview =
    document.getElementById("content-image-preview");

let currentImageUrl = null;

function getStoragePath(imageUrl) {

    if (!imageUrl) {
        return null;
    }

    const marker =
        "/storage/v1/object/public/diary-images/";

    const index =
        imageUrl.indexOf(marker);

    if (index === -1) {
        return null;
    }

    return imageUrl.substring(
        index + marker.length
    );
}


// URLから日記IDを取得
const params = new URLSearchParams(window.location.search);

const diaryId = params.get("id");


// 日記を読み込む
async function loadDiary() {

    // ログインユーザーを取得
    const {
        data: { user }
    } = await window.mySupabase.auth.getUser();


    // ログインしていなければログインページへ
    if (!user) {

        window.location.href = "login.html";

        return;
    }


    // IDがなければ戻る
    if (!diaryId) {

        message.textContent =
            "編集する記事が指定されていません。";

        return;
    }


    // 日記を取得
    const { data, error } = await window.mySupabase
    .from("diary")
    .select("id, title, content, user_id, category, image_url, is_public")
    .eq("id", diaryId)
    .single();


    // エラー
    if (error) {

        console.error(error);

        message.textContent =
            "記事を読み込めませんでした。";

        return;
    }


    // 自分の日記か確認
    if (data.user_id !== user.id) {

        message.textContent =
            "この記事は編集できません。";

        editForm.style.display = "none";

        return;
    }

// フォームに現在の内容を入れる
titleInput.value = data.title;

document.getElementById("category").value =
    data.category || "日記";

contentInput.value = data.content;

isPublicInput.checked =
    data.is_public !== false;


// 記事の画像
currentImageUrl = data.image_url;


// 本文画像をプレビュー表示
const imageMatches =
    data.content.match(/\[IMAGE:(.*?)\]/g) || [];

for (const imageText of imageMatches) {

    const imageUrl =
        imageText.replace("[IMAGE:", "").replace("]", "");

    const previewItem =
        document.createElement("div");

        previewItem.draggable = true;

    previewItem.className =
        "content-image-item";

        previewItem.dataset.url =
    imageUrl;

    const img =
        document.createElement("img");
        

    img.src = imageUrl;

    img.alt = "本文画像";

    previewItem.appendChild(img);

    const deleteButton =
    document.createElement("button");

deleteButton.type = "button";

deleteButton.textContent = "×";

deleteButton.className =
    "content-image-delete";

    deleteButton.addEventListener("click", () => {

    const imageText =
        `[IMAGE:${imageUrl}]`;

    contentInput.value =
        contentInput.value.replace(
            imageText,
            ""
        );

    previewItem.remove();

});

previewItem.appendChild(
    deleteButton
);

    contentImagePreview.appendChild(
        previewItem
    );

}


// 記事の画像を表示
if (data.image_url) {

    currentImage.innerHTML = `
        <img
            src="${data.image_url}"
            alt="現在の画像"
            style="width: 300px; max-width: 100%; border: 2px solid #000000;"
        >
    `;

} else {

    currentImage.innerHTML = `
        <p>画像はありません。</p>
    `;

}

}

// 保存
editForm.addEventListener("submit", async function(event) {

event.preventDefault();

const {
    data: { user }
} = await window.mySupabase.auth.getUser();

if (!user) {
    window.location.href = "login.html";
    return;
}

const title = titleInput.value;
const category =
    document.getElementById("category").value;

const content = contentInput.value;

const imageFile = imageInput.files[0];

const shouldDeleteImage =
    deleteImage.checked;

message.textContent = "保存中……";

let imageUrl = null;

if (imageFile) {

    const fileExt =
        imageFile.name.split(".").pop();

    const filePath =
        `${user.id}/${crypto.randomUUID()}.${fileExt}`;

    const { error: uploadError } =
        await window.mySupabase
            .storage
            .from("diary-images")
            .upload(filePath, imageFile);

    if (uploadError) {

        console.error(uploadError);

        message.textContent =
            "画像をアップロードできませんでした。";

        return;
    }

    const { data: publicUrlData } =
        window.mySupabase
            .storage
            .from("diary-images")
            .getPublicUrl(filePath);

    imageUrl =
        publicUrlData.publicUrl;
}


    const { error } = await window.mySupabase
        .from("diary")
.update({

    title: title,
    category: category,
    content: content,

    ...(imageUrl
        ? { image_url: imageUrl }
        : shouldDeleteImage
            ? { image_url: null }
            : {})

})
        .eq("id", diaryId);

        // 古い画像をStorageから削除
if ((imageUrl || shouldDeleteImage) && currentImageUrl) {

    const oldImagePath =
        getStoragePath(currentImageUrl);

    if (oldImagePath) {

        const { error: deleteError } =
            await window.mySupabase
                .storage
                .from("diary-images")
                .remove([oldImagePath]);

        if (deleteError) {
            console.error(
                "古い画像の削除に失敗しました:",
                deleteError
            );
        }
    }
}

    // エラー
    if (error) {

        console.error(error);

        message.textContent =
            "保存できませんでした。";

        return;
    }


    message.textContent =
        "保存しました！";


    // 少し待って日記一覧へ
    setTimeout(function() {

        window.location.href = "diary.html";

    }, 500);

});

// 本文画像を追加
const insertContentImageButton =
    document.getElementById("insert-content-image-button");

const editContentImage =
    document.getElementById("edit-content-image");

insertContentImageButton.addEventListener("click", () => {

    editContentImage.click();

});


editContentImage.addEventListener("change", async () => {

    const {
        data: { user }
    } = await window.mySupabase.auth.getUser();

    if (!user) {
        alert("ログインしてないよ！");
        return;
    }

    const files =
        Array.from(editContentImage.files);

    if (files.length === 0) {
        return;
    }


    for (const file of files) {

        const fileExt =
            file.name.split(".").pop();

        const filePath =
            `${user.id}/content-${crypto.randomUUID()}.${fileExt}`;


        const { error: uploadError } =
            await window.mySupabase
                .storage
                .from("diary-images")
                .upload(filePath, file);


        if (uploadError) {

            console.error(uploadError);

            alert(
                "本文画像をアップロードできなかったみたい…"
            );

            continue;
        }


        const { data: publicUrlData } =
            window.mySupabase
                .storage
                .from("diary-images")
                .getPublicUrl(filePath);


        const imageUrl =
            publicUrlData.publicUrl;


        // 本文の末尾に画像URLを追加
        contentInput.value +=
            `\n[IMAGE:${imageUrl}]\n`;


      // プレビューにも追加
const previewItem =
    document.createElement("div");

previewItem.className =
    "content-image-item";

previewItem.dataset.url =
    imageUrl;

previewItem.draggable = true;
const img =
    document.createElement("img");

img.src = imageUrl;

img.alt = "本文画像";

img.style.width = "100%";

img.style.height = "70px";

img.style.objectFit = "cover";

img.style.border = "2px solid #000000";

img.style.boxSizing = "border-box";


previewItem.appendChild(img);

const deleteButton =
    document.createElement("button");

deleteButton.type = "button";

deleteButton.textContent = "×";

deleteButton.className =
    "content-image-delete";

    deleteButton.addEventListener("click", () => {

    const imageText =
        `[IMAGE:${imageUrl}]`;

    contentInput.value =
        contentInput.value.replace(
            imageText,
            ""
        );

    previewItem.remove();

});

previewItem.appendChild(
    deleteButton
);

// プレビュー欄を取得し直す
const previewArea =
    document.getElementById("content-image-preview");

previewArea.appendChild(
    previewItem
);
    }


    // ファイル選択をリセット
    editContentImage.value = "";

});

let draggedItem = null;


contentImagePreview.addEventListener(
    "dragstart",
    (event) => {

        const item =
            event.target.closest(".content-image-item");

        if (!item) {
            return;
        }

        draggedItem = item;

        item.style.opacity = "0.5";
    }
);


contentImagePreview.addEventListener(
    "dragend",
    (event) => {

        const item =
            event.target.closest(".content-image-item");

        if (!item) {
            return;
        }

        item.style.opacity = "1";

        // プレビューの並び順を取得
        const imageItems =
            contentImagePreview.querySelectorAll(
                ".content-image-item"
            );

        const imageUrls =
            Array.from(imageItems).map(
                item => item.dataset.url
            );

        // 本文内の画像URLの順番を入れ替える
        let index = 0;

        contentInput.value =
            contentInput.value.replace(
                /\[IMAGE:(.*?)\]/g,
                () => {
                    const url = imageUrls[index];
                    index++;

                    return `[IMAGE:${url}]`;
                }
            );

        draggedItem = null;
    }
);


contentImagePreview.addEventListener(
    "dragover",
    (event) => {

        event.preventDefault();

        const target =
            event.target.closest(".content-image-item");

        if (!target || target === draggedItem) {
            return;
        }

        const rect =
            target.getBoundingClientRect();

        const middle =
            rect.left + rect.width / 2;

        if (event.clientX < middle) {

            contentImagePreview.insertBefore(
                draggedItem,
                target
            );

        } else {

            contentImagePreview.insertBefore(
                draggedItem,
                target.nextSibling
            );

        }
    }
);

// 実行
loadDiary();

</script>

</body>
</html>
