<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>記事を編集 - 健康市場 うにのきもち</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

</head>


<body>

<div class="site">

    <!-- ヘッダー -->
    <header>

        <div class="header-deco">✽✽✽</div>

        <h1>
            <img src="images/logo.png" alt="健康市場 うにのきもち">
        </h1>

        <p class="subtitle">
            - kenkoichiba uninokimochi -
        </p>

        <div class="header-deco">✽✽✽</div>

    </header>


    <main>

        <section>

            <h2>✽ 記事を編集 ✽</h2>


            <div style="padding: 25px;">

                <form id="edit-form">

                    <p>

                        <label>

                            タイトル<br>

                            <input
                                type="text"
                                id="title"
                                required
                                style="width: 100%; box-sizing: border-box;"
                            >

                        </label>

                    </p>

                    <p>
    <label>
        種類<br>

        <select id="category">

            <option value="日記">
                日記
            </option>

            <option value="感想">
                感想
            </option>

            <option value="進捗">
                進捗
            </option>

            <option value="雑談">
                雑談
            </option>

        </select>

    </label>
</p>


                    <p>

                        <label>

                            本文<br>

                            <textarea
                                id="content"
                                rows="12"
                                required
                                style="width: 100%; box-sizing: border-box;"
                            ></textarea>

                        </label>

                    </p>

                    <p>
    <label>
        現在の画像
    </label>
</p>

<div id="current-image">
    <!-- 現在の画像がここに表示されます -->
</div>

<p>
    <label>
        新しい画像<br>
        <input
            type="file"
            id="image"
            accept="image/*"
        >
    </label>
</p>

<p>
    <label>
        <input
            type="checkbox"
            id="delete-image"
        >
        今の画像を削除する
    </label>
</p>


                    <button type="submit">
                        保存
                    </button>


                    <p id="message"></p>

                </form>


                <p class="more">

                    → <a href="diary.html">雑記一覧に戻る</a>

                </p>

            </div>

        </section>


        <footer>

            ✽　since 2026　｜　健康市場 うにのきもち　｜　✽

        </footer>

    </main>

</div>


<script>

const editForm = document.getElementById("edit-form");

const titleInput = document.getElementById("title");

const contentInput = document.getElementById("content");

const imageInput = document.getElementById("image");

const currentImage =
    document.getElementById("current-image");

    const deleteImage =
    document.getElementById("delete-image");

const message = document.getElementById("message");

let currentImageUrl = null;

function getStoragePath(imageUrl) {

    if (!imageUrl) {
        return null;
    }

    const marker =
        "/storage/v1/object/public/diary-images/";

    const index =
        imageUrl.indexOf(marker);

    if (index === -1) {
        return null;
    }

    return imageUrl.substring(
        index + marker.length
    );
}


// URLから日記IDを取得
const params = new URLSearchParams(window.location.search);

const diaryId = params.get("id");


// 日記を読み込む
async function loadDiary() {

    // ログインユーザーを取得
    const {
        data: { user }
    } = await window.mySupabase.auth.getUser();


    // ログインしていなければログインページへ
    if (!user) {

        window.location.href = "login.html";

        return;
    }


    // IDがなければ戻る
    if (!diaryId) {

        message.textContent =
            "編集する記事が指定されていません。";

        return;
    }


    // 日記を取得
    const { data, error } = await window.mySupabase
        .from("diary")
        .select("id, title, content, user_id, category, image_url")
        .eq("id", diaryId)
        .single();


    // エラー
    if (error) {

        console.error(error);

        message.textContent =
            "記事を読み込めませんでした。";

        return;
    }


    // 自分の日記か確認
    if (data.user_id !== user.id) {

        message.textContent =
            "この記事は編集できません。";

        editForm.style.display = "none";

        return;
    }


    // フォームに現在の内容を入れる
    titleInput.value = data.title;
    document.getElementById("category").value = data.category || "日記";
    contentInput.value = data.content;


    currentImageUrl = data.image_url;
if (data.image_url) {

    currentImage.innerHTML = `
        <img
            src="${data.image_url}"
            alt="現在の画像"
            style="width: 300px; max-width: 100%; border: 2px solid #000000;"
        >
    `;

} else {

    currentImage.innerHTML = `
        <p>画像はありません。</p>
    `;

}

}


// 保存
editForm.addEventListener("submit", async function(event) {

event.preventDefault();

const {
    data: { user }
} = await window.mySupabase.auth.getUser();

if (!user) {
    window.location.href = "login.html";
    return;
}

const title = titleInput.value;
const category =
    document.getElementById("category").value;

const content = contentInput.value;

const imageFile = imageInput.files[0];

const shouldDeleteImage =
    deleteImage.checked;

message.textContent = "保存中……";

let imageUrl = null;

if (imageFile) {

    const fileExt =
        imageFile.name.split(".").pop();

    const filePath =
        `${user.id}/${crypto.randomUUID()}.${fileExt}`;

    const { error: uploadError } =
        await window.mySupabase
            .storage
            .from("diary-images")
            .upload(filePath, imageFile);

    if (uploadError) {

        console.error(uploadError);

        message.textContent =
            "画像をアップロードできませんでした。";

        return;
    }

    const { data: publicUrlData } =
        window.mySupabase
            .storage
            .from("diary-images")
            .getPublicUrl(filePath);

    imageUrl =
        publicUrlData.publicUrl;
}


    const { error } = await window.mySupabase
        .from("diary")
.update({

    title: title,
    category: category,
    content: content,

    ...(imageUrl
        ? { image_url: imageUrl }
        : shouldDeleteImage
            ? { image_url: null }
            : {})

})
        .eq("id", diaryId);

        // 古い画像をStorageから削除
if ((imageUrl || shouldDeleteImage) && currentImageUrl) {

    const oldImagePath =
        getStoragePath(currentImageUrl);

    if (oldImagePath) {

        const { error: deleteError } =
            await window.mySupabase
                .storage
                .from("diary-images")
                .remove([oldImagePath]);

        if (deleteError) {
            console.error(
                "古い画像の削除に失敗しました:",
                deleteError
            );
        }
    }
}

    // エラー
    if (error) {

        console.error(error);

        message.textContent =
            "保存できませんでした。";

        return;
    }


    message.textContent =
        "保存しました！";


    // 少し待って日記一覧へ
    setTimeout(function() {

        window.location.href = "diary.html";

    }, 500);

});


// 実行
loadDiary();

</script>

</body>
</html>
